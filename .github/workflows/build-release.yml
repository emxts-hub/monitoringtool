name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # Gives permission to publish GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name WinMacOS --paths=src --add-data "src/alert.wav;src" --icon=src/logo.ico --collect-all PyQt6 src/main.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Prepare test Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_SERVICE_ACCOUNT_JSON)) {
            throw "The FIREBASE_SERVICE_ACCOUNT_JSON repository secret is not configured."
          }
          Set-Content -Path service-account.json -Value $env:FIREBASE_SERVICE_ACCOUNT_JSON -Encoding utf8

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinMacOS-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}