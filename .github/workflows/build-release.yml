name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # Gives permission to publish GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyqt6 requests paramiko

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name WinMacOS --paths=src --icon=src/logo.ico --collect-all PyQt6 src/main.py

      - name: Compress Executable into ZIP
        run: |
          Compress-Archive -Path dist/WinMacOS.exe -DestinationPath dist/WinMacOS.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinMacOS.zip
            dist/WinMacOS.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}